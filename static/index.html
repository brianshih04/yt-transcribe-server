<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube AI SRT</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --text: #f1f1f1;
      --text-dim: #aaa;
      --accent: #3ea6ff;
      --accent-hover: #65b8ff;
      --border: #303030;
      --error: #ff4444;
      --success: #44ff88;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    h1 .logo { color: var(--accent); }
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input[type="text"], select, textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .status {
      text-align: center;
      color: var(--text-dim);
      padding: 8px;
      font-size: 14px;
    }
    .error {
      background: rgba(255,68,68,0.1);
      color: var(--error);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-dim);
      border: none;
      background: none;
    }
    .tab.active { background: var(--surface2); color: var(--text); }
    .transcript {
      max-height: 60vh;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .transcript .seg { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .transcript .seg .time { color: var(--accent); cursor: pointer; font-size: 12px; margin-right: 8px; }
    .summary { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
    #qa-messages { max-height: 50vh; overflow-y: auto; margin-bottom: 8px; }
    .qa-msg { padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .qa-user { background: var(--accent); color: #000; margin-left: 40px; }
    .qa-ai { background: var(--surface2); color: var(--text); margin-right: 40px; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .qa-thinking { animation: pulse 1.2s ease-in-out infinite; }
    .settings-toggle {
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      text-align: center;
      padding: 8px;
    }
    .settings-panel { display: none; }
    .settings-panel.open { display: block; }
    label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 8px; }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
      width: 0%;
    }
    .export-row { display: flex; gap: 8px; margin-top: 8px; }
    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

<h1><span class="logo">▶</span> YouTube AI SRT</h1>

<!-- URL 輸入 -->
<div class="card">
  <div class="input-row">
    <input type="text" id="url-input" placeholder="貼上 YouTube URL..." />
    <button class="btn" id="btn-fetch">抓字幕</button>
  </div>
  <div class="settings-toggle" id="settings-toggle">⚙ 設定</div>
  <div class="settings-panel" id="settings-panel">
    <label>LLM Provider</label>
    <select id="provider">
      <option value="deepseek">DeepSeek</option>
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
      <option value="custom">Custom (OpenAI compatible)</option>
    </select>
    <label>API Key</label>
    <input type="text" id="apikey" placeholder="sk-..." />
    <label>Model</label>
    <input type="text" id="model" placeholder="deepseek-chat" />
    <label>Base URL（可選覆寫）</label>
    <input type="text" id="baseurl" placeholder="https://api.deepseek.com" />
    <label>ASR Server</label>
    <input type="text" id="asrurl" value="https://yt-transcribe.avision-gb10.org" />
  </div>
</div>

<!-- 狀態 -->
<div class="status" id="status"></div>
<div class="progress-bar" id="progress-bar" style="display:none;"><div class="progress-fill" id="progress-fill"></div></div>
<div id="error-box"></div>

<!-- 結果 -->
<div id="result-area" style="display:none;">
  <div class="tabs">
    <button class="tab active" id="tab-transcript">逐字稿</button>
    <button class="tab" id="tab-summary">摘要</button>
    <button class="tab" id="tab-qa">問答</button>
  </div>
  <div class="card">
    <div class="transcript" id="transcript-view"></div>
    <div class="summary" id="summary-view" style="display:none;"></div>
    <div id="qa-view" style="display:none;">
      <div id="qa-messages"></div>
      <div class="input-row" style="margin-top:8px;">
        <input type="text" id="qa-input" placeholder="問關於這部影片的問題..." />
        <button class="btn" id="btn-ask">送出</button>
      </div>
    </div>
  </div>
  <div class="export-row">
    <button class="btn btn-secondary" id="btn-summary">⚡ 生成 AI 摘要</button>
    <button class="btn btn-secondary" id="btn-play">🔊 播放</button>
    <button class="btn btn-secondary" id="btn-srt">匯出 SRT</button>
    <button class="btn btn-secondary" id="btn-vtt">匯出 VTT</button>
  </div>
</div>

<script>
const API = window.location.origin;
let transcript = [];
let videoId = '';

// ── 元素 ────────────────────────────────
const $ = id => document.getElementById(id);

// ── 載入/儲存設定 ────────────────────────
function loadSettings() {
  const s = JSON.parse(localStorage.getItem('yt-srt-settings') || '{}');
  $('provider').value = s.provider || 'deepseek';
  $('apikey').value = s.apiKey || '';
  $('model').value = s.model || '';
  $('baseurl').value = s.baseurl || '';
  $('asrurl').value = s.asrUrl || API;
}
function saveSettings() {
  localStorage.setItem('yt-srt-settings', JSON.stringify({
    provider: $('provider').value,
    apiKey: $('apikey').value,
    model: $('model').value,
    baseUrl: $('baseurl').value,
    asrUrl: $('asrurl').value,
  }));
}

// ── 設定面板 ────────────────────────────
$('settings-toggle').addEventListener('click', () => {
  $('settings-panel').classList.toggle('open');
});
$('settings-panel').addEventListener('change', saveSettings);
$('settings-panel').addEventListener('input', saveSettings);

// ── 抓字幕 ──────────────────────────────
function extractVideoId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]+)/);
  return m ? m[1] : null;
}

$('btn-fetch').addEventListener('click', async () => {
  const url = $('url-input').value.trim();
  if (!url) return;
  videoId = extractVideoId(url);
  if (!videoId) { showError('無法解析 YouTube URL'); return; }

  $('error-box').innerHTML = '';
  $('result-area').style.display = 'none';
  showStatus('擷取字幕中...');
  $('btn-fetch').disabled = true;

  try {
    // 先試字幕擷取
    const asrUrl = $('asrurl').value || API;
    const resp = await fetch(`${asrUrl}/captions/${videoId}`, { method: 'POST' });
    if (resp.ok) {
      const data = await resp.json();
      if (data.segments && data.segments.length > 0) {
        transcript = data.segments;
        renderTranscript();
        showResult();
        return;
      }
    }
    // 字幕失敗 → ASR
    await transcribeViaASR(url);
  } catch (err) {
    // 嘗試 ASR fallback
    try { await transcribeViaASR(url); }
    catch (e2) { showError('字幕擷取失敗：' + err.message); }
  } finally {
    $('btn-fetch').disabled = false;
    hideStatus();
  }
});

// ── ASR 語音辨識 ────────────────────────
async function transcribeViaASR(url) {
  const asrUrl = $('asrurl').value || API;
  showStatus('提交語音辨識請求...');
  $('progress-bar').style.display = 'block';

  const resp = await fetch(`${asrUrl}/transcribe`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url }),
  });
  if (!resp.ok) throw new Error('ASR 提交失敗');
  const { job_id } = await resp.json();

  // 輪詢
  return new Promise((resolve, reject) => {
    const poll = setInterval(async () => {
      try {
        const r = await fetch(`${asrUrl}/job/${job_id}`);
        const data = await r.json();
        if (data.status === 'done' && data.result) {
          clearInterval(poll);
          $('progress-bar').style.display = 'none';
          transcript = data.result.segments;
          renderTranscript();
          showResult();
          resolve();
        } else if (data.status === 'failed') {
          clearInterval(poll);
          $('progress-bar').style.display = 'none';
          reject(new Error(data.message || 'ASR 失敗'));
        } else {
          $('progress-fill').style.width = (data.progress || 0) + '%';
          showStatus(data.message || '處理中...');
        }
      } catch (e) {}
    }, 3000);
  });
}

// ── 渲染逐字稿 ──────────────────────────
function renderTranscript() {
  const html = transcript.map((s, i) => {
    const time = formatTime(s.start);
    return `<div class="seg"><span class="time">${time}</span>${s.text}</div>`;
  }).join('');
  $('transcript-view').innerHTML = html;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function showResult() {
  $('result-area').style.display = 'block';
  hideStatus();
}

// ── Tab 切換 ────────────────────────────
$('tab-transcript').addEventListener('click', () => switchTab('transcript'));
$('tab-summary').addEventListener('click', () => switchTab('summary'));
$('tab-qa').addEventListener('click', () => switchTab('qa'));

function switchTab(tab) {
  $('tab-transcript').classList.toggle('active', tab === 'transcript');
  $('tab-summary').classList.toggle('active', tab === 'summary');
  $('tab-qa').classList.toggle('active', tab === 'qa');
  $('transcript-view').style.display = tab === 'transcript' ? 'block' : 'none';
  $('summary-view').style.display = tab === 'summary' ? 'block' : 'none';
  $('qa-view').style.display = tab === 'qa' ? 'block' : 'none';
}

// ── AI 問答 ─────────────────────────────
const qaHistory = [];

$('btn-ask').addEventListener('click', askQuestion);
$('qa-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') askQuestion();
});

async function askQuestion() {
  const question = $('qa-input').value.trim();
  if (!question) return;

  const apiKey = $('apikey').value.trim();
  if (!apiKey) { showError('請在設定中輸入 API Key'); $('settings-panel').classList.add('open'); return; }

  const provider = $('provider').value;
  const model = $('model').value || getDefaultModel(provider);
  const baseUrl = $('baseurl').value.trim() || getDefaultBaseUrl(provider);

  // 顯示問題
  appendQA('user', question);
  $('qa-input').value = '';
  $('btn-ask').disabled = true;

  // 顯示等待訊息
  const aiDiv = appendQA('assistant', '思考中...');
  aiDiv.classList.add('qa-thinking');

  // 準備 context（逐字稿截斷到合理長度）
  const context = transcript.map(s => `[${formatTime(s.start)}] ${s.text}`).join('\n');
  const trimmedContext = context.length > 12000 ? context.substring(0, 12000) + '\n...(截斷)' : context;

  const messages = [
    { role: 'system', content: `你是影片摘要助手。以下是 YouTube 影片逐字稿，請根據內容用繁體中文回答問題。\n\n逐字稿：\n${trimmedContext}` },
    ...qaHistory.map(h => ({ role: h.role, content: h.content })),
    { role: 'user', content: question },
  ];

  try {
    const answer = await callLLMMessages(provider, apiKey, model, baseUrl, messages);
    aiDiv.textContent = answer;
    aiDiv.classList.remove('qa-thinking');
    qaHistory.push({ role: 'user', content: question });
    qaHistory.push({ role: 'assistant', content: answer });
  } catch (err) {
    aiDiv.textContent = '❌ ' + err.message;
    aiDiv.classList.remove('qa-thinking');
  } finally {
    $('btn-ask').disabled = false;
  }
}

function appendQA(role, text) {
  const div = document.createElement('div');
  div.className = 'qa-msg ' + (role === 'user' ? 'qa-user' : 'qa-ai');
  div.textContent = text;
  $('qa-messages').appendChild(div);
  $('qa-messages').scrollTop = $('qa-messages').scrollHeight;
  return div;
}

async function callLLMMessages(provider, apiKey, model, baseUrl, messages) {
  if (provider === 'gemini') {
    const contents = messages.filter(m => m.role !== 'system').map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }],
    }));
    const sys = messages.find(m => m.role === 'system');
    const body = { contents };
    if (sys) body.systemInstruction = { parts: [{ text: sys.content }] };
    const resp = await fetch(`${baseUrl}/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { const e = await resp.text(); throw new Error(`HTTP ${resp.status}: ${e.substring(0, 200)}`); }
    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error('API 回傳空內容');
    return text;
  }

  const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages, max_tokens: 16384 }),
  });
  if (!resp.ok) { const e = await resp.text(); throw new Error(`HTTP ${resp.status}: ${e.substring(0, 200)}`); }
  const data = await resp.json();
  const text = data.choices?.[0]?.message?.content;
  if (!text) throw new Error('API 回傳空內容');
  return text;
}

// ── AI 摘要 ─────────────────────────────
$('btn-summary').addEventListener('click', generateSummary);

async function generateSummary() {
  if (transcript.length === 0) return;
  const apiKey = $('apikey').value.trim();
  if (!apiKey) { showError('請在設定中輸入 API Key'); $('settings-panel').classList.add('open'); return; }

  $('btn-summary').disabled = true;
  switchTab('summary');
  $('summary-view').textContent = '生成中...';

  const provider = $('provider').value;
  const model = $('model').value || getDefaultModel(provider);
  const baseUrl = $('baseurl').value.trim() || getDefaultBaseUrl(provider);
  const fullText = transcript.map(s => `[${formatTime(s.start)}] ${s.text}`).join('\n');

  // 分段處理（每段約 2000 字）
  const chunks = chunkText(fullText, 2000);

  const promptHeader = `以下是 YouTube 影片的逐字稿，請生成繁體中文摘要：

1. 一句話總結
2. 5 個重點（含近似時間戳）
3. 章節分段（含時間範圍）

`;

  try {
    if (chunks.length <= 1) {
      // 短逐字稿，一次處理
      const result = await callLLM(provider, apiKey, model, baseUrl, promptHeader + fullText);
      $('summary-view').textContent = result;
    } else {
      // 長逐字稿，分段摘要再彙整
      $('summary-view').textContent = `分段摘要中（共 ${chunks.length} 段）...\n\n`;

      const partials = [];
      for (let i = 0; i < chunks.length; i++) {
        const p = `這是影片逐字稿的第 ${i+1}/${chunks.length} 部分，請用繁體中文摘要這段的要點（含時間戳）：\n\n${chunks[i]}`;
        const r = await callLLM(provider, apiKey, model, baseUrl, p);
        partials.push(r);
        $('summary-view').textContent = `分段摘要中（共 ${chunks.length} 段）... 已完成 ${i+1}/${chunks.length}\n\n`;
      }

      // 彙整
      const mergePrompt = `${promptHeader}以下是影片各段落的摘要，請彙整成完整的摘要（一句話總結、5個重點含時間戳、章節分段）：\n\n${partials.join('\n\n---\n\n')}`;
      const final = await callLLM(provider, apiKey, model, baseUrl, mergePrompt);
      $('summary-view').textContent = final;
    }
  } catch (err) {
    $('summary-view').textContent = '';
    showError('摘要生成失敗：' + err.message);
  } finally {
    $('btn-summary').disabled = false;
  }
}

function chunkText(text, maxLen) {
  const lines = text.split('\n');
  const chunks = [];
  let cur = '';
  for (const line of lines) {
    if ((cur + line).length > maxLen) {
      if (cur) chunks.push(cur);
      cur = line + '\n';
    } else {
      cur += line + '\n';
    }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

function getDefaultModel(provider) {
  return { deepseek: 'deepseek-chat', openai: 'gpt-4o-mini', gemini: 'gemini-2.0-flash', custom: '' }[provider] || '';
}

function getDefaultBaseUrl(provider) {
  return { deepseek: 'https://api.deepseek.com', openai: 'https://api.openai.com', gemini: 'https://generativelanguage.googleapis.com', custom: '' }[provider] || '';
}

async function callLLM(provider, apiKey, model, baseUrl, prompt) {
  if (provider === 'gemini') {
    const resp = await fetch(`${baseUrl}/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${err.substring(0, 200)}`);
    }
    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error('API 回傳空內容');
    return text;
  }

  // OpenAI compatible (deepseek, openai, custom)
  const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model,
      messages: [{ role: 'user', content: prompt }],
      max_tokens: 16384,
    }),
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${err.substring(0, 200)}`);
  }
  const data = await resp.json();
  const text = data.choices?.[0]?.message?.content;
  if (!text) throw new Error('API 回傳空內容（model=' + model + ', finish_reason=' + (data.choices?.[0]?.finish_reason || '?') + '）');
  return text;
}

// ── 語音播放摘要 ────────────────────────
let utter = null;
let playing = false;
let voicesLoaded = false;

// iOS 需要提前載入語音清單
function initVoices() {
  if (typeof speechSynthesis === 'undefined') return;
  const v = speechSynthesis.getVoices();
  if (v.length > 0) { voicesLoaded = true; }
}
initVoices();
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = () => { initVoices(); };
}

$('btn-play').addEventListener('click', () => {
  if (typeof speechSynthesis === 'undefined') {
    showError('此瀏覽器不支援語音播放');
    return;
  }

  if (playing) {
    speechSynthesis.cancel();
    stopPlay();
    return;
  }

  // 根據當前 tab 決定播放內容
  let text = '';
  if ($('qa-view').style.display !== 'none') {
    const aiMsgs = document.querySelectorAll('#qa-messages .qa-ai');
    const last = aiMsgs[aiMsgs.length - 1];
    text = last ? last.textContent.trim() : '';
    if (!text || text === '思考中...') { showError('沒有可播放的 AI 回覆'); return; }
  } else {
    text = $('summary-view').textContent.trim();
    if (!text || text === '生成中...') { showError('請先生成摘要'); return; }
  }

  // 清除 markdown 符號
  const clean = text.replace(/[#*_>`]/g, '').replace(/\n{2,}/g, '\n\n');

  // iOS 修復：先 cancel 再 speak
  speechSynthesis.cancel();

  // 短延遲確保 cancel 完成（iOS 需要）
  setTimeout(() => {
    utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'zh-TW';
    utter.rate = 1.0;
    utter.pitch = 1.0;
    utter.volume = 1.0;

    // 嘗試找中文語音
    const voices = speechSynthesis.getVoices();
    const zh = voices.find(v => v.lang.startsWith('zh-TW'))
      || voices.find(v => v.lang.startsWith('zh'));
    if (zh) utter.voice = zh;

    utter.onend = stopPlay;
    utter.onerror = stopPlay;
    speechSynthesis.speak(utter);
    playing = true;
    $('btn-play').textContent = '⏸ 停止';
  }, 150);
});

function stopPlay() {
  playing = false;
  $('btn-play').textContent = '🔊 播放';
}

// ── 匯出 SRT/VTT ────────────────────────
$('btn-srt').addEventListener('click', () => exportFile('srt'));
$('btn-vtt').addEventListener('click', () => exportFile('vtt'));

function exportFile(format) {
  if (transcript.length === 0) return;
  let content = '';
  transcript.forEach((s, i) => {
    if (format === 'srt') content += `${i + 1}\n`;
    content += `${srtTime(s.start, format)} --> ${srtTime(s.start + s.dur, format)}\n${s.text}\n\n`;
  });
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${videoId}.${format}`;
  a.click();
}

function srtTime(sec, format) {
  const ms = Math.round((sec % 1) * 1000);
  const s = Math.floor(sec) % 60;
  const m = Math.floor(sec / 60) % 60;
  const h = Math.floor(sec / 3600);
  const sep = format === 'vtt' ? '.' : ',';
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}${sep}${ms.toString().padStart(3, '0')}`;
}

// ── 工具 ────────────────────────────────
function showStatus(msg) { $('status').textContent = msg; }
function hideStatus() { $('status').textContent = ''; }
function showError(msg) { $('error-box').innerHTML = `<div class="error">${msg}</div>`; }

// ── Enter 鍵 ────────────────────────────
$('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-fetch').click();
});

// 載入設定
loadSettings();
</script>
